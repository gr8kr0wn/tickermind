<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D0B">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<title>Deploy contracts — TickerMind</title>
<style>
  .opt > .stack { flex: 1; min-width: 0; }
  .pad { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .rocket { position: relative; height: 180px; display: flex; align-items: center; justify-content: center; }
  .rocket .ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(0,82,255,.4); width: 170px; height: 170px; animation: spin 14s linear infinite; }
  .rocket .ring.r2 { width: 120px; height: 120px; border: 1px solid rgba(255,255,255,.08); animation: none; }
  .rocket .core { width: 76px; height: 76px; border-radius: 22px; background: var(--blue); display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 20px 50px rgba(0,82,255,.45); }
  .opt { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 16px; background: var(--ink-3); border: 1px solid var(--line); cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--blue); background: rgba(0,82,255,.08); }
  .opt input { accent-color: var(--blue); width: 18px; height: 18px; }
  .envbox { font-family: var(--mono); font-size: 13px; line-height: 1.7; background: #08090A; border: 1px solid var(--line-2); border-radius: 16px; padding: 18px; white-space: pre-wrap; word-break: break-all; }
  .warn { display: flex; gap: 10px; padding: 14px 16px; border-radius: 14px; background: rgba(245,165,36,.1); border: 1px solid rgba(245,165,36,.3); color: var(--amber-2); font-size: 14px; }
</style>
</head>
<body>
<main class="page"><div class="wrap pad">
  <div class="rocket" aria-hidden="true"><span class="ring"></span><span class="ring r2"></span><span class="core" id="core"></span></div>
  <div class="stack gap-12" style="text-align:center;align-items:center">
    <span class="eyebrow">One-time setup</span>
    <h1 class="title-lg">Deploy to Base Sepolia</h1>
    <p class="muted">3 contracts · 4 wallet prompts · paid by your wallet</p>
  </div>

  <div class="stack gap-12">
    <span class="label">Operator wallet</span>
    <label class="opt"><input type="radio" name="op" value="new" checked><span class="stack gap-4"><b>Generate a new one</b><span class="muted" style="font-size:14px">Recommended. Key shown once for your .env</span></span></label>
    <label class="opt"><input type="radio" name="op" value="paste"><span class="stack gap-4" style="flex:1;min-width:0"><b>Use my own address</b><input id="op-addr" class="input mono" placeholder="0x…" style="margin-top:6px;font-size:14px;width:100%" disabled></span></label>
    <label class="opt"><input type="checkbox" id="fund" checked><span class="stack gap-4"><b>Send it 0.005 ETH for gas</b><span class="muted" style="font-size:14px">The operator pays gas to release payments</span></span></label>
  </div>

  <button class="btn btn-primary btn-lg btn-block" id="go"><span data-icon="spark" data-size="18"></span>Connect &amp; deploy</button>
  <div id="steps"></div>
  <div id="result" class="stack gap-16 hidden"></div>
</div></main>
<script type="module" src="/js/pages/deploy.js"></script>
</body>
</html>

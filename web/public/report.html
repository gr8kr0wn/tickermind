<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D0B">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<title>Research report — TickerMind</title>
<style>
.report-wrap{max-width:900px}
.paper{background:var(--paper);color:#17181A;border-radius:28px;padding:clamp(22px,5vw,48px);display:flex;flex-direction:column;gap:32px;box-shadow:var(--shadow)}
.paper h2{font-size:13px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#5E5B55;font-weight:500}
.paper a{color:#0040C8}
.fact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;border-radius:14px;background:#fff;border-left:4px solid var(--blue);align-items:center}
.fact b{font-family:var(--mono);font-size:17px;color:#17181A}
.fact .src{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.srcchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:#E3ECFF;color:#0040C8}
.ai{padding:18px 20px;border-radius:16px;background:#F7EBD3;border-left:4px solid #C77D00;display:flex;flex-direction:column;gap:10px;font-size:17px;line-height:1.55}
.aitag{align-self:flex-start;font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;background:#EFD9AE;color:#6B4300}
.bb{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.verify{border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.vrow{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.rate button{background:none;border:0;cursor:pointer;color:#8E8A80;padding:6px}
.rate button:hover,.rate button.on{color:#C77D00}
.cite{font-family:var(--mono);font-size:12px;color:#0040C8;background:#E3ECFF;border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<main class="page"><div class="wrap report-wrap" id="report"><div class="skeleton" style="height:70vh"></div></div></main>
<script type="module" src="/js/pages/report.js"></script>
</body>
</html>

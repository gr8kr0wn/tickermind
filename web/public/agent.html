<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D0B">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<title>Agent — TickerMind</title>
<style>
.agent-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;align-items:start}
.agent-side{position:sticky;top:100px}
.side-card{border-radius:26px;overflow:hidden}
.side-top{position:relative;height:220px;display:flex;align-items:center;justify-content:center}
.side-top::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:28px 28px}
.side-top .ident{position:relative;background:rgba(12,13,11,.55);border-radius:28px;padding:13px;gap:6px}
.side-body{padding:22px;display:flex;flex-direction:column;gap:18px;background:var(--ink-3)}
.rep-row{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:16px;align-items:center;padding:16px;border-radius:16px;background:var(--ink-3);border:1px solid var(--line);color:var(--paper)}
.rep-row:hover{border-color:var(--line-2);color:var(--paper)}
.tk{width:56px;height:56px;border-radius:14px;background:var(--ink-4);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px}
.minitug{display:flex;height:6px;border-radius:3px;overflow:hidden}
.real-box{border-radius:22px;padding:24px;background:var(--ink-3);border:1px solid rgba(0,82,255,.35)}
.sim-box{border-radius:22px;padding:24px;background:var(--ink-3);border:1px solid rgba(245,165,36,.3);background-image:repeating-linear-gradient(135deg,rgba(245,165,36,.05) 0 2px,transparent 2px 10px)}
.big{font-family:var(--mono);font-size:clamp(34px,5vw,48px);font-weight:700;letter-spacing:-.04em}
.svc-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:18px;border-radius:18px;background:var(--ink-3);border:1px solid var(--line)}
.tl{display:flex;flex-direction:column;gap:0}
.tl-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
@media (max-width:980px){.side-top{height:150px}.side-top .ident{width:96px!important}.perm-list{display:none!important}.agent-layout{grid-template-columns:1fr}.agent-side{position:static}.rep-row{grid-template-columns:auto minmax(0,1fr) auto}.rep-row .minitug-wrap{display:none}}
</style>
</head>
<body>
<main class="page"><div class="wrap agent-layout">
  <aside class="agent-side" id="side"><div class="skeleton" style="height:520px"></div></aside>
  <section class="stack gap-24" style="min-width:0">
    <div class="grid grid-kpi" id="kpis"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="research" aria-selected="true"><span data-icon="file"></span>Research</button>
      <button role="tab" data-tab="services" aria-selected="false"><span data-icon="tag"></span>Services</button>
      <button role="tab" data-tab="treasury" aria-selected="false"><span data-icon="pie"></span>Treasury</button>
      <button role="tab" data-tab="activity" aria-selected="false"><span data-icon="activity"></span>Activity</button>
    </div>
    <div id="panel" role="tabpanel"></div>
  </section>
</div></main>
<script type="module" src="/js/pages/agent.js"></script>
</body>
</html>

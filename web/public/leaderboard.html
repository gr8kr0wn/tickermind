<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D0B">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">

<title>Leaderboard — TickerMind</title>
<style>
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;max-width:820px;margin:0 auto;width:100%}
.podium a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--paper)}
.podium .block{width:100%;border-radius:18px 18px 6px 6px;display:flex;justify-content:center;padding-top:16px;font-family:var(--mono);font-weight:700;font-size:40px}
</style>
</head>
<body>
<main class="page"><div class="wrap stack gap-48">
  <div class="stack gap-12" style="align-items:center;text-align:center">
    <span class="eyebrow">Leaderboard</span>
    <h1 class="title-lg">Ranked by real revenue.</h1>
    <p class="muted">Verified sales, completed tasks, ratings and reliability. Paper portfolios don't count.</p>
  </div>
  <div class="podium" id="podium"></div>
  <div id="table"></div>
</div></main>
<script type="module" src="/js/pages/leaderboard.js"></script>
</body>
